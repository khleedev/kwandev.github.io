<svg viewBox="0 0 820 360" xmlns="http://www.w3.org/2000/svg" font-family="'Pretendard', -apple-system, 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <text x="410" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">속성값은 크기가 아니라 '비율'이다</text>

  <!-- step 1: HTML -->
  <text x="120" y="80" text-anchor="middle" font-size="13" font-weight="600" fill="#475569">HTML 속성</text>
  <rect x="30" y="95" width="180" height="70" rx="8" fill="#0f172a"/>
  <text x="46" y="128" font-size="13" font-family="monospace" fill="#e2e8f0">width=<tspan fill="#7dd3fc">"200"</tspan></text>
  <text x="46" y="150" font-size="13" font-family="monospace" fill="#e2e8f0">height=<tspan fill="#7dd3fc">"200"</tspan></text>

  <line x1="218" y1="130" x2="272" y2="130" stroke="#64748b" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- step 2: browser computes ratio -->
  <text x="360" y="80" text-anchor="middle" font-size="13" font-weight="600" fill="#475569">브라우저 계산</text>
  <rect x="285" y="95" width="150" height="70" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="360" y="123" text-anchor="middle" font-size="12" fill="#1e40af">aspect-ratio</text>
  <text x="360" y="148" text-anchor="middle" font-size="18" font-weight="700" fill="#2563eb">1 : 1</text>

  <line x1="443" y1="130" x2="497" y2="130" stroke="#64748b" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- step 3: rendered at any size, same ratio -->
  <text x="655" y="80" text-anchor="middle" font-size="13" font-weight="600" fill="#475569">화면 표시 (CSS로 크기 자유)</text>

  <rect x="515" y="95" width="70" height="70" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="550" y="135" text-anchor="middle" font-size="11" font-weight="600" fill="#1d4ed8">1:1</text>
  <text x="550" y="182" text-anchor="middle" font-size="11" fill="#64748b">200px</text>

  <rect x="620" y="95" width="140" height="140" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="690" y="170" text-anchor="middle" font-size="13" font-weight="600" fill="#1d4ed8">1:1</text>
  <text x="690" y="252" text-anchor="middle" font-size="11" fill="#64748b">400px</text>

  <!-- bottom note -->
  <rect x="30" y="285" width="760" height="52" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="410" y="308" text-anchor="middle" font-size="13" fill="#166534">브라우저는 값 자체(200)를 크기로 쓰지 않고, 두 값의 비율만 뽑아 공간을 예약해요.</text>
  <text x="410" y="327" text-anchor="middle" font-size="13" fill="#166534">비율만 맞으면 CSS로 200px든 400px든 크기는 마음대로 바꿔도 CLS가 안 생겨요.</text>
</svg>
