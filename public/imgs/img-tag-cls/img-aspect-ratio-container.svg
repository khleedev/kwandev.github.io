<svg viewBox="0 0 820 340" xmlns="http://www.w3.org/2000/svg" font-family="'Pretendard', -apple-system, 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <defs>
    <marker id="arrow3" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <clipPath id="boxClip"><rect x="560" y="120" width="200" height="112" rx="6"/></clipPath>
    <g id="mount">
      <circle cx="26" cy="24" r="10" fill="#bfdbfe"/>
      <path d="M0 90 L40 40 L70 72 L100 34 L150 90 Z" fill="#93c5fd"/>
    </g>
  </defs>

  <text x="410" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">비율을 모를 땐 '칸'을 고정한다 (aspect-ratio + object-fit)</text>

  <!-- original image (unknown/tall ratio) -->
  <text x="115" y="90" text-anchor="middle" font-size="13" font-weight="600" fill="#475569">원본 이미지</text>
  <rect x="70" y="105" width="90" height="130" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <g transform="translate(85,120) scale(0.6)"><use href="#mount"/></g>
  <text x="115" y="256" text-anchor="middle" font-size="12" fill="#94a3b8">비율 제각각 · 알 수 없음</text>

  <!-- arrow + rule -->
  <line x1="190" y1="170" x2="250" y2="170" stroke="#64748b" stroke-width="2" marker-end="url(#arrow3)"/>
  <rect x="270" y="120" width="210" height="100" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="375" y="150" text-anchor="middle" font-size="12" font-family="monospace" fill="#334155">aspect-ratio: 16/9</text>
  <text x="375" y="175" text-anchor="middle" font-size="12" font-family="monospace" fill="#334155">object-fit: cover</text>
  <text x="375" y="202" text-anchor="middle" font-size="12" fill="#64748b">칸을 먼저 고정</text>

  <line x1="490" y1="170" x2="548" y2="170" stroke="#64748b" stroke-width="2" marker-end="url(#arrow3)"/>

  <!-- fixed 16:9 container with cover -->
  <text x="660" y="90" text-anchor="middle" font-size="13" font-weight="600" fill="#475569">고정된 16:9 칸</text>
  <!-- image scaled to cover, clipped -->
  <g clip-path="url(#boxClip)">
    <rect x="560" y="88" width="200" height="176" fill="#dbeafe"/>
    <g transform="translate(600,120) scale(1.05)"><use href="#mount"/></g>
    <rect x="560" y="88" width="200" height="32" fill="#0f172a" opacity="0.06"/>
    <rect x="560" y="232" width="200" height="32" fill="#0f172a" opacity="0.06"/>
  </g>
  <rect x="560" y="120" width="200" height="112" rx="6" fill="none" stroke="#3b82f6" stroke-width="2"/>
  <text x="660" y="252" text-anchor="middle" font-size="11" fill="#94a3b8">위·아래는 잘림 (crop)</text>

  <!-- bottom note -->
  <rect x="70" y="292" width="690" height="34" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="415" y="314" text-anchor="middle" font-size="13" fill="#166534">칸의 크기가 로드 전부터 정해져 있으니, 원본 비율을 몰라도 CLS가 생기지 않아요.</text>
</svg>
